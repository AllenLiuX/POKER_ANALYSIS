# =============================================================================
# Poker Analysis —— poker.aico-music.com 单域名反代
#
# 本机架构：所有 server 块直接写在 /etc/nginx/nginx.conf 的 http{} 里
# （/etc/nginx/conf.d/*.conf 并未被 include，是历史遗留，勿用）。
# 这两个 server 块由 deploy/enable_nginx_https.sh 自动注入到 nginx.conf，
# 也可手动把内容粘到 nginx.conf 的 http{} 末尾（最后一个 } 之前）。
#
# 路由：
#   /health /docs /openapi.json /api/  → 后端 FastAPI  127.0.0.1:8010
#   其余（/ 及前端页面/资源）           → 前端 Next.js  127.0.0.1:3010
#
# 依赖：先有证书 /etc/letsencrypt/live/poker.aico-music.com/
#      （enable_nginx_https.sh 会先用 webroot 签好再注入 443 块）
# =============================================================================

# ---- HTTP：acme 续签 + 强跳 HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name poker.aico-music.com;

    # certbot HTTP-01 续签走 80（与本机既有约定一致）
    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt/;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS：单域名收敛前后端 ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name poker.aico-music.com;

    ssl_certificate     /etc/letsencrypt/live/poker.aico-music.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poker.aico-music.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 截图 / 手牌导入上传留足空间
    client_max_body_size 20M;

    # Next.js + Supabase cookie 可能几 KB，默认 4k proxy header buffer 会撞 502，加大兜住
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # ---- 后端 API（LLM 复盘 / 截图解析可能较慢，超时放宽）----
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health       { proxy_pass http://127.0.0.1:8010/health; access_log off; }
    location /docs           { proxy_pass http://127.0.0.1:8010/docs; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8010/openapi.json; }

    # ---- 前端 Next.js ----
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
