# nginx 反向代理示例（可选，推荐生产使用）。
# 把前端(3000)与后端(8000)收敛到同一个 80/443 域名下：
#   /       → 前端 Next.js
#   /api/   → 后端 FastAPI
#   /health, /docs → 后端
#
# 这样浏览器只访问一个域名，避免 CORS / 混合内容问题。此时前端可这样配置：
#   NEXT_PUBLIC_API_BASE_URL=https://your-domain.com   （请求 /api/... 会命中后端）
#
# 安装：
#   sudo cp deploy/nginx/poker.conf /etc/nginx/conf.d/poker.conf
#   # 修改 server_name 为你的域名或公网 IP
#   sudo nginx -t && sudo systemctl reload nginx
#   # HTTPS 建议用 certbot： sudo certbot --nginx -d your-domain.com

server {
    listen 80;
    server_name your-domain.com;   # 改成你的域名 / 公网 IP

    client_max_body_size 20m;      # 截图上传留足空间

    # ---- 后端 API ----
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location = /health { proxy_pass http://127.0.0.1:8000/health; }
    location /docs      { proxy_pass http://127.0.0.1:8000/docs; }
    location /openapi.json { proxy_pass http://127.0.0.1:8000/openapi.json; }

    # ---- 前端 ----
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
