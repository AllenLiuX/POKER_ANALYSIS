[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wpk-hand-recorder"
version = "0.1.0"
description = "Local, privacy-conscious WPK hand history recorder using Chrome DevTools Protocol"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "msgpack>=1.0,<2",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.34,<1",
  "websockets>=12,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
wpk-recorder = "wpk_recorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wpk_recorder = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
